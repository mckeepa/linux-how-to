apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp-route
  namespace: headlamp
spec:
  parentRefs:
  - name: my-gateway
    namespace: default
  hostnames:
  - "dashboard.gardenofrot.cc"
  rules:
  - matches:
    - path: { type: PathPrefix, value: / }
    backendRefs:
    - name: headlamp
      port: 80
