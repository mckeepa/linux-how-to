# gateway-routing.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
spec:
  gatewayClassName: cilium # Pre-installed by Cilium
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces: { from: Same }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud-route
spec:
  parentRefs: [{ name: main-gateway }]
  hostnames: ["cloud.local"]
  rules:
  - backendRefs: [{ name: nextcloud, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: onlyoffice-route
spec:
  parentRefs: [{ name: main-gateway }]
  hostnames: ["office.local"]
  rules:
  - backendRefs: [{ name: onlyoffice, port: 80 }]
