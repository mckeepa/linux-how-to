# routing.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gardenofrot-gateway
spec:
  gatewayClassName: cilium # Standard for Cilium Gateway API
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces: { from: Same }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud-route
spec:
  parentRefs: [{ name: gardenofrot-gateway }]
  hostnames: ["cloud.gardenofrot.cc"]
  rules:
  - backendRefs: [{ name: nextcloud, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: onlyoffice-route
spec:
  parentRefs: [{ name: gardenofrot-gateway }]
  hostnames: ["office.gardenofrot.cc"]
  rules:
  - backendRefs: [{ name: onlyoffice, port: 80 }]
